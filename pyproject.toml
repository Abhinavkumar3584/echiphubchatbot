[project]
name = "echiphubchatbot"
version = "0.1.0"
description = "eChipHub Assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "qdrant-client>=1.12,<1.21",
    "fastembed>=0.5,<1"
]

[tool.vercel]
entrypoint = "api:app"

